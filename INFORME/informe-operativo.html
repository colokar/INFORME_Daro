<style>
  :root {
    --azul-oscuro: #292a4e;
    --azul-medio: #47658e;
    --gris-azulado: #7e7f93;
    --gris-claro: #c9cfe6;
    --dorado: #e6b85f;
    --bg: #eef1f7;
    --card: #ffffff;
    --border: #d5dbe9;
    --muted: #e3e8f2;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Lora', Georgia, serif;
    background: var(--bg);
    color: var(--azul-oscuro);
    line-height: 1.5;
    padding: 24px 0 48px;
  }
  .wrap { width: 100%; max-width: none; margin: 0 auto; padding: 0 32px; }

  /* Header */
  .header {
    background: var(--azul-oscuro);
    color: #fff;
    border-radius: var(--radius);
    padding: 28px 32px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(41,42,78,.15);
  }
  .header .logos { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 8px; }
  .header .logos .brand { font-size: 13px; letter-spacing: .5px; color: var(--gris-claro); text-align: left; }
  .header h1 { font-size: 34px; font-weight: 700; letter-spacing: .5px; }
  .header .sub { color: var(--dorado); font-weight: 600; margin-top: 4px; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .header .periodo { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: var(--gris-claro); background: rgba(255,255,255,.08); padding: 6px 14px; border-radius: 999px; }

  /* Date filter */
  .filter { background: var(--card); border-radius: calc(var(--radius) * 1.5); padding: 24px 28px; margin-top: 18px; border: 1px solid var(--border); box-shadow: 0 10px 24px rgba(41,42,78,.08); display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }
  .filter .mode { display: inline-flex; background: var(--muted); border-radius: 999px; padding: 6px; margin-bottom: 18px; }
  .filter .mode button { border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: var(--gris-azulado); padding: 10px 20px; border-radius: 999px; cursor: pointer; }
  .filter .mode button.active { background: var(--azul-oscuro); color: #fff; }
  .filter .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: center; width: 100%; }
  .field { display: flex; flex-direction: column; gap: 6px; width: 260px; max-width: 100%; position: relative; }
  .field label { font-size: 11px; font-weight: 700; color: var(--gris-azulado); text-transform: uppercase; letter-spacing: .8px; }
  .field select, .field input { font-family: inherit; font-size: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: #fff; color: var(--azul-oscuro); width: 100%; padding-right: 40px; }
  .field::after { content: ''; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--gris-azulado); pointer-events: none; }
  .filter-action { display: flex; justify-content: center; width: 100%; margin-top: 18px; }
  .filter-action button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: none; background: var(--azul-oscuro); color: #fff; font-family: inherit; font-size: 13px; font-weight: 700; padding: 14px 24px; border-radius: 999px; cursor: pointer; text-transform: uppercase; letter-spacing: .8px; box-shadow: 0 8px 18px rgba(41,42,78,.18); }
  .filter-action .btn-icon { font-size: 14px; }
  .hidden { display: none !important; }

  /* Tabs */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 18px; justify-content: center; }
  .tabs button { font-family: inherit; font-size: 14px; font-weight: 600; padding: 12px 24px; border: 1px solid var(--border); background: var(--card); color: var(--azul-medio); border-radius: 18px; cursor: pointer; transition: all .15s; }
  .tabs button:hover { border-color: var(--azul-medio); }
  .tabs button.active { background: var(--azul-oscuro); color: #fff; border-color: var(--azul-oscuro); }

  /* Cards / sections */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 18px; box-shadow: 0 4px 12px rgba(41,42,78,.05); }
  .section-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: var(--azul-oscuro); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--muted); }
  .section-title .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--dorado); }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; width: 100%; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; }
  .stacked-blocks { display: grid; grid-template-columns: 1fr; gap: 18px; width: 100%; }
  .stacked-blocks .card { width: 100%; min-height: auto; }
  .full-width-card { width: 100%; }
  .kpi .label { font-size: 13px; color: var(--gris-azulado); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .kpi .value { font-size: 30px; font-weight: 700; color: var(--azul-oscuro); margin-top: 6px; }
  .kpi .split { font-size: 12px; color: var(--gris-azulado); margin-top: 6px; }

  /* Split bar */
  .metric-block { margin-bottom: 18px; }
  .metric-block h4 { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: var(--azul-medio); }
  .bar { display: flex; height: 30px; border-radius: 8px; overflow: hidden; background: var(--muted); }
  .bar .seg { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .bar .seg.cargas { background: var(--azul-oscuro); }
  .bar .seg.pasajeros { background: var(--azul-medio); }
  .legend { display: flex; gap: 18px; margin-top: 8px; font-size: 12px; color: var(--gris-azulado); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; }

  /* Motivos */
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .motivo { margin-bottom: 12px; }
  .motivo .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; gap: 8px; }
  .motivo .desc { color: var(--azul-oscuro); }
  .motivo .num { color: var(--gris-azulado); font-weight: 600; white-space: nowrap; }
  .track { height: 8px; background: var(--muted); border-radius: 999px; overflow: hidden; }
  .track .fill { height: 100%; border-radius: 999px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  thead th { background: var(--azul-oscuro); color: #fff; font-weight: 600; }
  thead th:first-child { border-top-left-radius: 8px; }
  thead th:last-child { border-top-right-radius: 8px; }
  tbody tr:nth-child(even) { background: #f6f8fc; }
  tbody tr.total-row { font-weight: 700; background: var(--muted); }
  .col-hi { background: rgba(230,184,95,.14); font-weight: 700; }
  .table-scroll { overflow-x: auto; }
  .note { font-size: 12px; color: var(--gris-azulado); margin-top: 10px; font-style: italic; }

  /* Simple SVG bar chart container */
  .chart { width: 100%; }

  .footer { text-align: center; color: var(--gris-azulado); font-size: 12px; margin-top: 26px; }
  .footer strong { color: var(--azul-oscuro); }

  .group-title { font-size: 15px; font-weight: 700; color: var(--azul-medio); margin: 18px 0 8px; }

    .grid-3 { grid-template-columns: 1fr; }

    .filter { padding: 18px 18px; }

// Espera que `Generador.py` inyecte un objeto global `window.REPORT_CONFIG` con la forma:
let MONTHS = [];
let N = 0;

function loadCalendarConfig(){
  const cfg = window.REPORT_CONFIG || {};
  if(!Array.isArray(cfg.months) || cfg.months.length===0){
    console.error("REPORT_CONFIG.months no definido o vacío. El calendario es dinámico y requiere datos del generador.");
    return;
  }
  MONTHS = cfg.months.map(m=>({ key:m.key, label:m.label, short:m.short, start:m.start, end:m.end }));
  N = MONTHS.length;
  // configurar controles de rango (date inputs)
  const dFrom = document.getElementById('dFrom');
  const dTo = document.getElementById('dTo');
  const min = cfg.minDate || MONTHS[0].start;
  const max = cfg.maxDate || MONTHS[N-1].end;
  if(dFrom && dTo){
    dFrom.min = min; dTo.min = min;
    dFrom.max = max; dTo.max = max;
    const curFrom = (cfg.currentPeriod && cfg.currentPeriod.from) || min;
    const curTo = (cfg.currentPeriod && cfg.currentPeriod.to) || max;
    dFrom.value = curFrom; dTo.value = curTo;
  }
  // poblar select por mes
  const mFrom = document.getElementById('mFrom');
  const mTo = document.getElementById('mTo');
  if(mFrom && mTo){
    mFrom.innerHTML = '';
    mTo.innerHTML = '';
    MONTHS.forEach((m,i)=>{
      mFrom.insertAdjacentHTML('beforeend', `<option value="${i}">${m.label}</option>`);
      mTo.insertAdjacentHTML('beforeend', `<option value="${i}">${m.label}</option>`);
    });
    const curFrom = (cfg.currentPeriod && cfg.currentPeriod.from) || MONTHS[0].start;
    const curTo = (cfg.currentPeriod && cfg.currentPeriod.to) || MONTHS[N-1].end;
    mFrom.value = String(dateToIdx(curFrom,false));
    mTo.value = String(dateToIdx(curTo,true));
  }
}

// Permite aplicar configuración en caliente (útil si Python inyecta después de cargar la página)
function applyReportConfig(cfg){
  window.REPORT_CONFIG = cfg || {};
  try{ loadCalendarConfig(); }catch(e){ console.error('Error aplicando REPORT_CONFIG',e); }
  if(N>0) render();
}

// Cargar dashboardData desde JSON generado por Python (datos.json) o desde window.DASHBOARD_JSON
async function loadDashboardData(){
  const injected = window.DASHBOARD_JSON || null;
  let src = injected;
  if(!src){
    try{
      const r = await fetch('datos.json', {cache:'no-store'});
      if(r.ok) src = await r.json();
    }catch(e){ console.warn('No se pudo cargar datos.json:', e); }
  }
  if(!src){
    console.warn('dashboardData no disponible. El frontend quedará con placeholders.');
    return;
  }
  
  dashboardData.resumen = src.resumen || src.metadata || {};
  dashboardData.regiones = src.regiones || {};
  
  const pi = src.principal_infracciones || {};
  dashboardData.motivos.cargas = (pi.cargas && pi.cargas.motivos) ? pi.cargas.motivos.map(m=>({desc:m.nombre,pct:m.porcentaje,count:m.cantidad||0})) : [];
  dashboardData.motivos.pasajeros = (pi.pasajeros && pi.pasajeros.motivos) ? pi.pasajeros.motivos.map(m=>({desc:m.nombre,pct:m.porcentaje,count:m.cantidad||0})) : [];
  
  if(src.metricas) {
    dashboardData.indicadores = src.metricas;
    actualizarIndicadoresDesdeMetricas(src.metricas);
  }
  if(src.resumen){ dashboardData.resumen = {...dashboardData.resumen, ...src.resumen}; }
  if(src.monthly){ dashboardData.monthly = src.monthly; }
  if(src.gendarmeria){ dashboardData.gendarmeria = src.gendarmeria; }
  if(src.control){ dashboardData.control = src.control; }
}

function applyDashboardJson(json){
  window.DASHBOARD_JSON = json;
  loadDashboardData().then(()=>{ if(N>0) render(); });
}

async function fetchDashboardData(desde, hasta){
  const payload = {};
  if(desde) payload.desde = desde;
  if(hasta) payload.hasta = hasta;

  try{
    const response = await fetch('/api/procesar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const json = await response.json();
    if(!response.ok || json.status === 'error'){
      console.error('Error al procesar el informe:', json.message || response.statusText);
      alert(json.message || 'No se pudieron obtener los datos. Revisá el rango y volvé a intentar.');
      return;
    }

    applyDashboardJson(json);
  }catch(e){
    console.error('Error al solicitar datos al backend:', e);
    alert('No se pudieron obtener los datos del servidor. Verificá que el backend esté activo y volvé a intentar.');
  }
}

function getSelectedDateRange(){
  if(mode === 'range'){
    const dFrom = document.getElementById('dFrom');
    const dTo = document.getElementById('dTo');
    return {

      hasta: dTo ? dTo.value : ''
    };
  }
  const mFrom = document.getElementById('mFrom');
  const mTo = document.getElementById('mTo');
  const fromIdx = mFrom ? parseInt(mFrom.value, 10) : 0;
  const toIdx = mTo ? parseInt(mTo.value, 10) : (N - 1);
  return {
    desde: (MONTHS[fromIdx] && MONTHS[fromIdx].start) || '',
    hasta: (MONTHS[toIdx] && MONTHS[toIdx].end) || ''
  };
}

const fmt = n => new Intl.NumberFormat("es-AR").format(Math.round(n));
const clamp = (s,e) => { s=Math.max(0,Math.min(s,N-1)); e=Math.max(0,Math.min(e,N-1)); if(s>e)[s,e]=[e,s]; return [s,e]; };
const sumR = (a,s,e) => { let t=0; for(let i=s;i<=e;i++) t+=a[i]||0; return t; };
const avgR = (a,s,e) => { const n=e-s+1; return n>0? sumR(a,s,e)/n : 0; };
const metricR = (m,s,e) => { const c=sumR(m.cargas,s,e), p=sumR(m.pasajeros,s,e); return {cargas:c,pasajeros:p,total:c+p}; };
const aggInd = (it,s,e) => it.tipo==="cantidad" ? sumR(it.v,s,e) : avgR(it.v,s,e);
const fmtInd = (val,tipo) => tipo==="porcentaje" ? val.toFixed(2)+"%" : fmt(val);

// Date -> month index
function dateToIdx(dateStr, isEnd) {
  if(!dateStr) return isEnd? N-1 : 0;
  const d = new Date(dateStr+"T00:00:00");
  for(let i=0;i<N;i++){
    const s=new Date(MONTHS[i].start+"T00:00:00"), e=new Date(MONTHS[i].end+"T00:00:00");
    if(d>=s && d<=e) return i;
  }
  const first=new Date(MONTHS[0].start), last=new Date(MONTHS[N-1].end);
  if(d<first) return 0;
  if(d>last) return N-1;
  return isEnd? N-1 : 0;
}

function currentRange() {
  if(mode==="month") {
    const mFromEl = document.getElementById("mFrom"), mToEl = document.getElementById("mTo");
    if(!mFromEl || !mToEl) return [0, Math.max(0, N-1)];
    return clamp(parseInt(mFromEl.value,10), parseInt(mToEl.value,10));
  } else {
    const dFromEl = document.getElementById("dFrom"), dToEl = document.getElementById("dTo");
    if(!dFromEl || !dToEl) return [0, Math.max(0, N-1)];
    return clamp(dateToIdx(dFromEl.value,false), dateToIdx(dToEl.value,true));
  }
}

function splitBar(m){
  const cp = m.total? (m.cargas/m.total*100):50;
  const pp = 100-cp;
  return `<div class="bar">
    <div class="seg cargas" style="width:${cp}%">${cp>12?fmt(m.cargas):''}</div>
    <div class="seg pasajeros" style="width:${pp}%">${pp>12?fmt(m.pasajeros):''}</div>
  </div>
  <div class="legend">
    <span><span class="sw" style="background:var(--azul-oscuro)"></span>Cargas: ${fmt(m.cargas)}</span>
    <span><span class="sw" style="background:var(--azul-medio)"></span>Pasajeros: ${fmt(m.pasajeros)}</span>
  </div>`;
}

function motivoList(list, color){
  if(!list || !list.length) return `<p class="note">Sin datos registrantes para el período.</p>`;
  const max = Math.max(...list.map(x=>x.pct)) || 1;
  return list.map(m=>`
    <div class="motivo">
      <div class="top"><span class="desc">${m.desc}</span><span class="num">${m.pct}% · ${fmt(m.count)}</span></div>
      <div class="track"><div class="fill" style="width:${(m.pct/max*100)}%;background:${color}"></div></div>
    </div>`).join("");
}

function svgBarChart(serie){
  if(!serie || !serie.length) return "";
  const w=Math.max(360, serie.length*90), h=220, pad=30, bw=26;
  const max=Math.max(...serie.flatMap(d=>[d.cnrt||0,d.gendarmeria||0]))*1.1||1;
  const scale=v=>(h-pad-20)-(v/max*(h-pad-30));
  let bars="";
  serie.forEach((d,i)=>{
    const x=pad+i*90+20;
    const y1=scale(d.cnrt||0), y2=scale(d.gendarmeria||0);
    bars+=`<rect x="${x}" y="${y1}" width="${bw}" height="${h-pad-20-y1}" fill="var(--azul-oscuro)" rx="3"></rect>`;
    bars+=`<rect x="${x+bw+6}" y="${y2}" width="${bw}" height="${h-pad-20-y2}" fill="var(--dorado)" rx="3"></rect>`;
    bars+=`<text x="${x+bw}" y="${h-6}" font-size="12" fill="#7e7f93" text-anchor="middle">${d.mes||''}</text>`;
    bars+=`<text x="${x+bw/2}" y="${y1-4}" font-size="10" fill="#292a4e" text-anchor="middle">${d.cnrt||0}</text>`;
    bars+=`<text x="${x+bw+6+bw/2}" y="${y2-4}" font-size="10" fill="#47658e" text-anchor="middle">${d.gendarmeria||0}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" style="max-width:100%">${bars}</svg>`;
}

  `;
}

function indTable(items,s,e,multi){
  const rows = (items||[]).map(it=>{
    const cells=[]; for(let i=s;i<=e;i++) cells.push(`<td>${fmtInd((it.v&&it.v[i])||0,it.tipo)}</td>`);
    return `<tr><td style="font-family:monospace;font-size:11px;color:var(--gris-azulado)">${it.nom||it.code||''}</td><td>${it.nombre||it.label||''}</td>${cells.join("")}<td class="col-hi">${fmtInd(aggInd(it,s,e),it.tipo)}</td></tr>`;
  }).join("");
  const monthHeaders=[]; for(let i=s;i<=e;i++) monthHeaders.push(`<th>${(MONTHS[i]&&MONTHS[i].short)||''}</th>`);
  const aggLabel = multi ? "Período" : ((MONTHS[s]&&MONTHS[s].short)||'');
  return `<div class="table-scroll"><table>
    <thead><tr><th>Código</th><th>Indicador</th>${monthHeaders.join("")}<th class="col-hi" style="background:#b5921f">${aggLabel}</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderSec2(s,e){
  const multi = s!==e;
  let groupsHtml = (dashboardData.indicadoresGrupos||[]).map(g=>`<div class="group-title" style="font-weight:bold;margin-top:15px;margin-bottom:5px;color:var(--azul-oscuro)">${g.nombre}</div>${indTable(g.items,s,e,multi)}`).join("");
  let resoHtml = indTable(dashboardData.reso284, s, e, multi);
  
  document.getElementById("sec2").innerHTML = `
    <div class="card">
      <div class="section-title"><span class="dot"></span>Matriz de Indicadores Físicos de Fiscalización</div>
      ${groupsHtml}
    </div>
    <div class="card" style="margin-top:20px;">
      <div class="section-title"><span class="dot"></span>Resolución 284/09 (Viajes Ocasionales)</div>
      ${resoHtml}
    </div>
  `;
}

function render(){
  const [s,e] = currentRange();
  const subEl = document.getElementById("subperiodo");
  if(subEl) subEl.textContent = periodoText(s,e);
  renderSec0(s,e);
  renderSec1(s,e);
  renderSec2(s,e);
}

// ============================================================================
// CONEXIÓN BACKEND (Mapeo de métricas devueltas por Python hacia los arrays `v`)
// ============================================================================
function actualizarIndicadoresDesdeMetricas(metricas){
  if(!metricas) return;
  
  // Mapea un ítem si existe en la respuesta de Python
  const mapItem = (item) => {
    if(metricas[item.nom] && Array.isArray(metricas[item.nom])){
      item.v = metricas[item.nom];
    }
  };

  dashboardData.indicadoresGrupos.forEach(grupo => {
    grupo.items.forEach(mapItem);
  });
  
  dashboardData.reso284.forEach(mapItem);
}

// ============================================================================
// INICIALIZACIÓN
// ============================================================================
document.addEventListener("DOMContentLoaded", async () => {
  loadCalendarConfig();
  await loadDashboardData();
  if(N>0) render();
});
</script>
